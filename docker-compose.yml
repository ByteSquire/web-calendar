# Example deployment: the web calendar (Nuxt 4 / Nitro, SPA plus CalDAV gateway) and Radicale, its
# CalDAV store. Kanidm is an existing external service (docs/kanidm-setup.md).
#
# Every NUXT_* value below is read from the environment, or from the .env file next to this file
# (Compose uses it for interpolation), and maps to a runtimeConfig key in nuxt.config.ts. The defaults
# written here repeat the ones in nuxt.config.ts: an empty value in .env falls back to them.
# Named volumes hold the two things to back up: the app's SQLite file (web-calendar-data) and
# Radicale's calendars (radicale-data).
#
# Radicale's rules: the static rights file is bind-mounted from deploy/radicale/rights, read-only. The
# group file lives in the radicale-groups volume: the app creates it empty at startup (see the
# Dockerfile) and, from Phase 3, rewrites it; Radicale mounts the volume read-only and starts after
# the app is healthy, so the file exists by then.

x-radicale-image: &radicale-image ghcr.io/kozea/radicale:3.9.0 # the project's own image

services:
  web-calendar:
    build: .
    image: web-calendar:latest
    restart: unless-stopped
    init: true
    # Bind to loopback only: expect a reverse proxy (TLS) in front; deploy/reverse-proxy/README.md
    # has worked examples.
    ports:
      - '127.0.0.1:3000:3000'
    # default: everything else this service needs (Kanidm, the outbound hosts). radicale: shared
    # only with the radicale service below, so nothing else on this Docker host can ever send it a
    # request, whatever network another container is later attached to (security review
    # 2026-11-01, finding 8).
    networks:
      - default
      - radicale
    environment:
      # OIDC (generic: Kanidm, Keycloak, ...). The issuer as the provider's discovery document writes
      # it; for Kanidm it ends with the app's own public client.
      NUXT_OIDC_ISSUER: '${NUXT_OIDC_ISSUER:-}'
      NUXT_OIDC_CLIENT_ID: '${NUXT_OIDC_CLIENT_ID:-web-calendar}'
      # Further clients whose JWTs the gateway accepts (comma-separated); empty means the client above.
      NUXT_OIDC_ALLOWED_CLIENTS: '${NUXT_OIDC_ALLOWED_CLIENTS:-}'
      # Key for hashing app tokens. Generate one, for example with `openssl rand -base64 48`.
      NUXT_TOKEN_HASH_KEY: '${NUXT_TOKEN_HASH_KEY:-}'
      # Rotation: `version:key` entries separated by commas, the current key first; the key above is
      # version 1 (server/utils/auth/token-keys.ts). Empty means only that key.
      NUXT_TOKEN_HASH_KEYS: '${NUXT_TOKEN_HASH_KEYS:-}'
      # Radicale's group file: the app writes it from its own groups, Radicale reads it.
      NUXT_GROUPS_FILE: /groups/htgroup
      # Group whose members are admins (name, SPN, id or path as the provider writes it); not empty.
      NUXT_OIDC_ADMIN_GROUP: '${NUXT_OIDC_ADMIN_GROUP:-calendar_admins}'
      # The claim that lists a person's groups, and the groups that are never offered for import.
      # WARNING: adding an entry that matches a group imported already takes its members out of it at
      # their next sign-in (see .env.example); the people stay registered and keep other groups.
      NUXT_OIDC_GROUPS_CLAIM: '${NUXT_OIDC_GROUPS_CLAIM:-groups}'
      NUXT_OIDC_GROUPS_IGNORE: '${NUXT_OIDC_GROUPS_IGNORE:-idm_*,system_*,domain_*}'
      # Scopes the browser asks for, and the scope every access token must carry (also what keeps
      # ID tokens out). Providers differ: see docs/oidc-providers.md.
      NUXT_OIDC_SCOPE: '${NUXT_OIDC_SCOPE:-openid profile email groups caldav}'
      NUXT_OIDC_REQUIRED_SCOPE: '${NUXT_OIDC_REQUIRED_SCOPE:-caldav}'
      # Further `aud` values that make an access token ours (Auth0, Entra API identifiers), comma-separated.
      NUXT_OIDC_AUDIENCE: '${NUXT_OIDC_AUDIENCE:-}'
      # Host names besides the issuer's own that the signing keys may come from (comma-separated).
      NUXT_OIDC_JWKS_HOSTS: '${NUXT_OIDC_JWKS_HOSTS:-}'
      # Seconds the cached signing keys are used before they are fetched again.
      NUXT_OIDC_KEY_MAX_AGE_SEC: '${NUXT_OIDC_KEY_MAX_AGE_SEC:-3600}'
      # Days after a person's last sign-in that their app tokens work and they count as being in the
      # group of everyone (1 to 365).
      NUXT_SIGNIN_WINDOW_DAYS: '${NUXT_SIGNIN_WINDOW_DAYS:-30}'
      # CalDAV gateway
      NUXT_GATEWAY_CORS_ORIGINS: '${NUXT_GATEWAY_CORS_ORIGINS:-}'
      # Largest request body (one event) the gateway forwards, in bytes. Keep it equal to
      # max_content_length in deploy/radicale/config, which Radicale reads instead of this variable.
      NUXT_GATEWAY_MAX_BODY_BYTES: '${NUXT_GATEWAY_MAX_BODY_BYTES:-10485760}'
      # Requests one user may have in flight at once; the next ones get 429 until one finishes.
      NUXT_GATEWAY_MAX_CONCURRENT_PER_USER: '${NUXT_GATEWAY_MAX_CONCURRENT_PER_USER:-8}'
      # true: the client address of the failed-login throttle is the last entry of X-Forwarded-For
      # (the address the reverse proxy in front of this service appended), not the socket's. Set it
      # only when that proxy is the one way to reach this service and writes the header; otherwise a
      # client names any address and escapes the throttle. false: every client shares the proxy's.
      NUXT_GATEWAY_TRUST_FORWARDED_FOR: '${NUXT_GATEWAY_TRUST_FORWARDED_FOR:-false}'
      # iCal proxy (.ics subscriptions): cache seconds, largest file in bytes, fetch timeout in ms.
      NUXT_ICAL_PROXY_CACHE_TTL_SEC: '${NUXT_ICAL_PROXY_CACHE_TTL_SEC:-300}'
      NUXT_ICAL_PROXY_MAX_BYTES: '${NUXT_ICAL_PROXY_MAX_BYTES:-5242880}'
      NUXT_ICAL_PROXY_TIMEOUT_MS: '${NUXT_ICAL_PROXY_TIMEOUT_MS:-10000}'
      # For tests only: true switches the SSRF guard off, and the server then refuses to start
      # (NODE_ENV=production in this image).
      NUXT_ICAL_PROXY_ALLOW_PRIVATE: '${NUXT_ICAL_PROXY_ALLOW_PRIVATE:-false}'
      # Hosts the server may contact for its users (iCal subscriptions, external CalDAV accounts):
      # comma-separated names, `*.example.org` for a domain. This image runs in production, where an
      # empty list is refused (the server does not start) unless NUXT_OUTBOUND_ALLOW_ANY_HOST is true.
      NUXT_OUTBOUND_ALLOWED_HOSTS: '${NUXT_OUTBOUND_ALLOWED_HOSTS:-}'
      # true: with no list above, any public host may be contacted. Ignored when a list is set.
      NUXT_OUTBOUND_ALLOW_ANY_HOST: '${NUXT_OUTBOUND_ALLOW_ANY_HOST:-false}'
      # Seals the passwords of external CalDAV accounts: 32 random bytes as base64 or hex, for
      # example `openssl rand -base64 32`. Empty means accounts with a login are off.
      NUXT_EXTERNAL_SEAL_KEY: '${NUXT_EXTERNAL_SEAL_KEY:-}'
      # For previews and browser tests only: true skips the login and shows mock data (logged loudly).
      NUXT_DEMO: '${NUXT_DEMO:-false}'
      # Fixed by this file: the SQLite volume and the internal Radicale service.
      NUXT_DB_PATH: /data/web-calendar.db
      NUXT_RADICALE_URL: http://radicale:5232
      # The organization time zone
      TZ: '${TZ:-Europe/Berlin}'
    volumes:
      - web-calendar-data:/data # SQLite file
      - radicale-groups:/groups # Radicale's group file, written by the app (uid 1000, the node user)
    # Hardening
    read_only: true
    tmpfs:
      - /tmp
      - /app/.output/cache
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # Healthy means the server is up AND its CalDAV gateway answers: the public config answers 200,
    # and /caldav/ without credentials answers 401 (a bad configuration would answer 500 there, or
    # the process would not be running at all). It never calls the identity provider on purpose: an
    # outage there must not make the container unhealthy and restart a working app.
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "Promise.all([fetch('http://127.0.0.1:3000/api/config'), fetch('http://127.0.0.1:3000/caldav/')]).then(([config, caldav]) => process.exit(config.status === 200 && caldav.status === 401 ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
      # Probe often while starting: Radicale waits for this service to be healthy.
      start_interval: 2s

  radicale:
    image: *radicale-image
    restart: unless-stopped
    # No published port, and no `default` network: Radicale trusts X-Remote-User, so only the app,
    # on the `radicale` network below, may reach it. Do not add `ports:` here.
    # Radicale refuses to start without its group file, which the app creates when it starts.
    networks:
      - radicale
    depends_on:
      web-calendar:
        condition: service_healthy
    volumes:
      # Calendars and the sharing database. Radicale has no quota: check the size per user with
      # scripts/radicale-usage.mjs, run on the host against this volume (see the script's header).
      - radicale-data:/var/lib/radicale
      - radicale-groups:/etc/radicale/groups:ro # group file, written by the app
      - ./deploy/radicale/rights:/etc/radicale/rights:ro
      - ./deploy/radicale/config:/etc/radicale/config:ro
    # Hardening (the image already runs as the unprivileged user radicale, uid 1000)
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ['CMD', 'nc', '-z', '127.0.0.1', '5232']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  default:
  # internal: true means Docker gives it no route out, so nothing on it can reach the internet or
  # be reached from outside the host, whatever is later attached to `default`.
  radicale:
    internal: true

volumes:
  web-calendar-data:
  radicale-data:
  radicale-groups:
