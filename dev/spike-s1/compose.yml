# Test stack for the spikes in docs/design.md §12: Kanidm (OIDC provider) and Radicale (CalDAV
# store). The app's server (the CalDAV gateway) is developed separately and talks to both.
name: spike-s1

services:
  kanidm:
    image: ${KANIDM_IMAGE:-kanidm/server:latest}
    restart: unless-stopped
    networks:
      default:
        # Containers must reach Kanidm under the same name the browser uses.
        aliases:
          - idm.localhost
    ports:
      - '127.0.0.1:8443:8443'
    volumes:
      - kanidm-data:/data
      - ./kanidm/server.toml:/data/server.toml:ro
      - ./.local/certs/kanidm-chain.pem:/data/chain.pem:ro
      - ./.local/certs/server.key:/data/key.pem:ro

  radicale:
    # The Radicale project's own image (tags: 3.9.0, stable, latest = nightly builds).
    image: ${RADICALE_IMAGE:-ghcr.io/kozea/radicale:3.9.0}
    restart: unless-stopped
    # Test stack only: Radicale trusts X-Remote-User, so in production it must have no published
    # port and only the app's gateway may reach it.
    ports:
      - '127.0.0.1:5232:5232'
    volumes:
      - radicale-data:/var/lib/radicale
      - ./radicale/config:/etc/radicale/config:ro
      - ./.local/rules:/etc/radicale/rules:ro

volumes:
  kanidm-data:
  radicale-data:
